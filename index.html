<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오늘의 주인공은 나다냥">
<title>오늘의 주인공은 나다냥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Jua&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  /* 한 가지 세계: 포근한 방 안, 고양이 귀가 달린 딸기우유빛 뽑기 기계 한 대. 기계만 보이고, SETTINGS 판을 누르면 계기판이 펼쳐진다. */
  :root {
    color-scheme: light;
    --navy: #d9679a;
    --ink: #5a2342;
    --silver: #fff3f8;
    --silver-dark: #e3a9c4;
    --red: #c2356f;
    --paper: #ffffff;
    --font-ko: "Do Hyeon", "Malgun Gothic", sans-serif;
    --font-px: "Press Start 2P", "Do Hyeon", monospace;
    --panel-w: min(340px, 41vw);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: #cfe6f5; color: var(--paper); font-family: var(--font-ko); }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #stage {
    display: block;
    height: min(98vh, calc(98vw / 0.8333));
    height: min(98dvh, calc(98vw / 0.8333));
    aspect-ratio: 600 / 720;
    width: auto;
    touch-action: manipulation;
    cursor: pointer;
    transform: translateX(5%);
  }
  /* 계기판을 열어도 기계는 가운데 그대로 있고, 계기판이 오른쪽에 겹쳐 뜬다 */

  .panel {
    position: fixed; top: 10px; right: 10px; bottom: 10px; width: var(--panel-w);
    overflow-y: auto;
    background: var(--navy);
    border: 3px solid var(--paper);
    outline: 3px solid var(--ink);
    box-shadow: 7px 7px 0 rgba(168,67,106,.5);
    padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .panel[hidden], .exclude[hidden] { display: none; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 3px solid var(--red); padding-bottom: 8px; }
  h1 { font-family: var(--font-px); font-weight: 400; font-size: 15px; margin: 0; letter-spacing: .04em; text-shadow: 2px 2px 0 var(--ink); }
  .now { display: flex; align-items: center; gap: 12px; background: #5a2342; border: 3px solid var(--silver-dark); padding: 8px 12px; }
  .now.win { animation: winflash .22s steps(2) 10; }
  @keyframes winflash { 50% { background: #ff8fb8; border-color: #fff; } }
  .now-label { font-size: 15px; color: var(--silver); }
  .now-num { font-family: var(--font-px); font-size: 34px; line-height: 1.2; min-width: 2.2em; text-align: center; color: #ffd24d; text-shadow: 3px 3px 0 #2e0f20; }
  .now-num.pop { animation: pop .4s steps(4); }
  @keyframes pop { from { transform: scale(.2); } to { transform: none; } }

  .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  button, .range {
    font-family: var(--font-ko); font-size: 15px;
    color: var(--ink); background: var(--silver);
    border: 0; border-radius: 0;
    box-shadow: inset -3px -3px 0 var(--silver-dark), inset 3px 3px 0 #fff, 0 0 0 2px var(--ink);
    padding: 8px 6px;
  }
  button { cursor: pointer; }
  button:active:not(:disabled) { box-shadow: inset 3px 3px 0 var(--silver-dark), inset -3px -3px 0 #fff, 0 0 0 2px var(--ink); }
  button:focus-visible, .range:focus-within { outline: 3px solid #ffd24d; outline-offset: 3px; }
  button:disabled { cursor: default; opacity: .5; }
  #drawBtn { flex: 1 1 100%; font-size: 20px; padding: 10px; color: #fff; background: var(--red); box-shadow: inset -3px -3px 0 #8f1f4f, inset 3px 3px 0 #f58fb6, 0 0 0 2px var(--ink); }
  #drawBtn:active:not(:disabled) { box-shadow: inset 3px 3px 0 #8f1f4f, inset -3px -3px 0 #f58fb6, 0 0 0 2px var(--ink); }
  .sub { flex: 1 1 40%; white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 6px; }
  #resetBtn.armed, .sub.toggle[aria-pressed="true"] { background: #ffd24d; }
  #closeBtn { font-family: var(--font-px); font-size: 11px; padding: 7px 8px; flex: none; }
  .range { cursor: text; }
  .range input { width: 3.6em; min-width: 0; font: inherit; color: var(--red); text-align: center; border: 0; border-bottom: 2px dashed var(--red); border-radius: 0; background: transparent; padding: 0; }
  .range input:focus { outline: none; border-bottom-style: solid; }
  .range.bad { animation: shake .3s steps(4); }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  .section-head { display: flex; justify-content: space-between; align-items: baseline; }
  .section-head h2 { font-family: var(--font-ko); font-weight: 400; font-size: 16px; margin: 0; }
  #count { font-family: var(--font-px); font-size: 10px; color: var(--silver); }
  .exclude small { font-size: 13px; color: var(--silver); }
  .history, .ex-grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; margin-top: 6px; }
  .slot { container-type: inline-size; aspect-ratio: 1; border: 2px dashed rgba(255,255,255,.3); }
  .slot.filled { border: none; }
  .chip { width: 100%; height: 100%; background: var(--silver); box-shadow: inset -2px -2px 0 var(--silver-dark), inset 2px 2px 0 #fff, 0 0 0 2px var(--ink); display: grid; place-items: center; font-family: var(--font-px); font-size: 32cqw; line-height: 1; color: var(--red); animation: pop .3s steps(3); }
  .slot.latest .chip { background: #fff4c9; box-shadow: inset -2px -2px 0 #e0a020, inset 2px 2px 0 #fff, 0 0 0 2px var(--red); }
  .ex-grid button { aspect-ratio: 1; padding: 0; min-width: 0; font-family: var(--font-px); font-size: 9px; box-shadow: inset -2px -2px 0 var(--silver-dark), inset 2px 2px 0 #fff, 0 0 0 2px var(--ink); }
  .ex-grid button.off { background: #5a2342; color: var(--silver-dark); text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; box-shadow: 0 0 0 2px var(--red); }
  .hint { margin: 0; font-size: 13px; color: var(--silver); }

  /* 세로로 든 폰: 계기판은 아래에서 올라오고, 기계는 위쪽으로 줄어든다 */
  @media (orientation: portrait) {
    :root { --panel-w: 100vw; }
    .panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 54vh; max-height: 54dvh; }
    body.open .stage { padding: 4px 0 0; place-items: start center; }
    body.open #stage { height: min(43vh, calc(98vw / 0.8333)); height: min(43dvh, calc(98vw / 0.8333)); }
    .history, .ex-grid { grid-template-columns: repeat(10, minmax(0, 1fr)); }
    .hint { display: none; }
  }
  /* 가로로 눕힌 폰: 계기판을 촘촘하게 */
  @media (orientation: landscape) and (max-height: 560px) {
    .panel { top: 6px; right: 8px; bottom: 6px; padding: 8px; gap: 6px; box-shadow: 4px 4px 0 rgba(168,67,106,.5); }
    .head { padding-bottom: 5px; }
    h1 { font-size: 12px; }
    .now { padding: 3px 10px; }
    .now-num { font-size: 26px; }
    .buttons { gap: 6px; }
    button, .range { font-size: 13px; padding: 5px 4px; }
    #drawBtn { font-size: 17px; padding: 6px; }
    .section-head h2 { font-size: 14px; }
    .history, .ex-grid { grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; margin-top: 4px; }
    .ex-grid button { font-size: 7px; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .now-num.pop, .chip, .now.win { animation: none; } }

  /* 부드러운 딸기우유 계기판 */
  :root { --navy: #fff0f5; --ink: #8a3558; --silver: #ffffff; --silver-dark: #f6b6cc; --red: #ff5c93; --paper: #8a3558; --font-ko: Jua, "Do Hyeon", "Malgun Gothic", sans-serif; --font-px: Jua, "Do Hyeon", "Malgun Gothic", sans-serif; }
  .panel { border: 3px solid #fff; outline: none; border-radius: 26px; box-shadow: 0 10px 30px rgba(168,67,106,.28); padding: 16px; }
  .head { border-bottom: 2px dashed var(--silver-dark); }
  h1 { font-size: 20px; letter-spacing: .06em; text-shadow: none; color: var(--red); }
  .now { background: #fff; border: 2px dashed var(--silver-dark); border-radius: 18px; }
  .now.win { animation: winflash .22s steps(2) 10; }
  @keyframes winflash { 50% { background: #fff1a8; border-color: var(--red); } }
  .now-label, #count, .exclude small, .hint { color: #b86a8a; }
  #count { font-size: 14px; }
  .now-num { font-size: 44px; line-height: 1.1; color: var(--red); text-shadow: none; }
  .now-num.pop { animation: pop .4s cubic-bezier(.3, 1.6, .5, 1); }
  button, .range { border: 2px solid var(--silver-dark); border-radius: 999px; box-shadow: 0 3px 0 var(--silver-dark); padding: 7px 8px; transition: transform .08s, box-shadow .08s; }
  button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--silver-dark); }
  button:focus-visible, .range:focus-within { outline: 3px solid #ffd166; outline-offset: 2px; }
  #drawBtn { background: var(--red); border-color: #e0457c; box-shadow: 0 4px 0 #e0457c; }
  #drawBtn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #e0457c; }
  #resetBtn.armed, .sub.toggle[aria-pressed="true"] { background: #fff1a8; }
  #closeBtn { font-size: 14px; padding: 4px 11px; }
  .slot { border: 2px dashed var(--silver-dark); border-radius: 50%; }
  .chip { border-radius: 50%; box-shadow: none; border: 2px solid var(--silver-dark); font-size: 40cqw; color: var(--ink); }
  .slot.latest .chip { background: #fff1a8; border-color: var(--red); box-shadow: none; }
  .ex-grid button { border-radius: 50%; box-shadow: none; font-size: 13px; }
  .ex-grid button.off { background: var(--ink); color: #fff; border-color: var(--ink); box-shadow: none; }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main class="stage">
  <canvas id="stage" width="305" height="432" role="img" aria-label="슬롯머신. 기계를 누르면 레버가 당겨지고, 아래쪽 SETTINGS 판을 누르면 계기판이 열립니다."></canvas>
</main>

<section class="panel" id="panel" aria-label="시스템" hidden>
  <div class="head">
    <h1>SETTINGS</h1>
    <button id="closeBtn" type="button" aria-label="닫기">X</button>
  </div>

  <div class="now" id="nowBox">
    <span class="now-label">이번 번호</span>
    <span class="now-num" id="nowNum" aria-live="polite">?</span>
  </div>

  <div class="buttons">
    <button id="drawBtn" type="button">레버 당기기</button>
    <button id="resetBtn" class="sub" type="button">처음부터 다시</button>
    <button id="fullBtn" class="sub" type="button">전체 화면</button>
    <label class="sub range" for="rangeInput">번호 <input id="rangeInput" type="text" inputmode="text" autocomplete="off" value="1-30" aria-label="번호 범위"></label>
    <button id="soundBtn" class="sub" type="button" aria-pressed="true">소리 켜짐</button>
    <button id="exBtn" class="sub toggle" type="button" aria-pressed="false" aria-controls="exclude" style="flex-basis:100%">제외할 번호</button>
  </div>

  <div>
    <div class="section-head">
      <h2>나온 순서</h2>
      <span id="count">0 / 30</span>
    </div>
    <div class="history" id="history"></div>
  </div>

  <div class="exclude" id="exclude" hidden>
    <div class="section-head">
      <h2>제외할 번호</h2>
      <small>누르면 추첨에서 빠집니다</small>
    </div>
    <div class="ex-grid" id="exGrid"></div>
  </div>

  <p class="hint">기계나 스페이스바로 레버를 당기고, S 키로 이 창을 여닫습니다.</p>
</section>

<script>
(() => {
  const MAX_COUNT = 40;
  let LO = 1, HI = 30, TOTAL = 30;                  // 번호 범위(화면의 '번호' 칸에서 바꾼다)

  const W = 600, H = 720, OX = 0, OY = 0, CX = 270;    // 기계 그림의 크기와 몸통 가운데
  const LINE = '#a8436a';
  const NUMFONT = 'Jua, "Do Hyeon", "Malgun Gothic", sans-serif';

  // 릴(칸): 0 = 그림, 1 = 십의 자리, 2 = 일의 자리. 띠에는 숫자(또는 행운 그림)와 과일이 번갈아 놓인다.
  const FRUITS = ['fish', 'mouse', 'yarn', 'paw', 'milk'];
  const CHARMS = ['cat', 'bell', 'star', 'heart'];
  const strips = [
    CHARMS.flatMap((c, i) => [{ s: c }, { s: FRUITS[(i * 2 + 1) % 5] }]),
    Array.from({ length: 10 }, (_, d) => [{ d }, { s: FRUITS[d % 5] }]).flat(),
    Array.from({ length: 10 }, (_, d) => [{ d }, { s: FRUITS[(d + 2) % 5] }]).flat()
  ];
  const REEL_W = 94, REEL_GAP = 20, ITEM = 66, REEL_TOP = 247, REEL_H = 114, REEL_CY = REEL_TOP + REEL_H / 2;
  const reelX = r => CX - (REEL_W * 3 + REEL_GAP * 2) / 2 + r * (REEL_W + REEL_GAP);
  // 멈추는 순서: 그림 → 일의 자리 → 십의 자리. 서서히 빨라졌다가 서서히 멈춘다.
  //   start: 출발 시각, acc: 가속 시간, dec: 감속 시작 시각, slow: 감속 시간 (초)
  //   p: 감속 곡선. 2면 고르게 느려지고, 클수록 마지막에 오래 기어간다
  const TEMPO = [
    { start: 0.00, acc: 0.60, dec: 1.00, slow: 2.90, p: 3.0 },
    { start: 0.16, acc: 0.60, dec: 2.40, slow: 6.50, p: 3.3, tee: 1.35, tip: 0.50 },   // 마지막 칸: 앞 숫자에 걸려 머뭇거리다(tee) 툭 넘어간다(tip)
    { start: 0.08, acc: 0.60, dec: 1.60, slow: 3.80, p: 3.0 }
  ];
  const TEE_CHANCE = 0.25;                           // 가운데 칸이 머뭇거리다 넘어갈 확률(0 = 절대 안 함, 1 = 매번)
  const VMAX = 30;                                   // 가장 빠를 때 1초에 지나가는 칸 수
  const BOUNCE = 0.46;                               // 멈춘 뒤 살짝 튕기는 시간(초)
  const PULL = 0.26, HOLD = 0.10;                    // 레버: 당기는 시간, 붙잡고 있는 시간(초)
  const WIN_MS = 2800;                               // 당첨 축하가 이어지는 시간

  const $ = id => document.getElementById(id);
  // 기계는 화면 픽셀 수 그대로의 해상도로 매끄럽게 그린다
  let PX = 1, stageDev = 0;
  const canvas = $('stage'), ctx = canvas.getContext('2d');
  function fitStage() {
    const dev = Math.round(canvas.clientHeight * (window.devicePixelRatio || 1));
    if (!dev || dev === stageDev) return;
    stageDev = dev; PX = dev / H;
    canvas.width = Math.round(W * PX); canvas.height = dev;
  }
  fitStage();
  const drawBtn = $('drawBtn'), resetBtn = $('resetBtn'), soundBtn = $('soundBtn'), exBtn = $('exBtn'), panel = $('panel');
  const nowNum = $('nowNum'), nowBox = $('nowBox'), countEl = $('count'), historyEl = $('history'), exGrid = $('exGrid');

  let remaining = [];    // 아직 안 나온 번호
  let prize = null;      // 출구에 나온 보상 그림
  let drawn = [];        // 나온 번호 (순서대로)
  let userEx = new Set();// 화면에서 고른 제외 번호
  let state = 'idle';    // idle → spin → idle
  let spinT = 0;         // 릴이 돌기 시작하는 시각(ms) = 레버를 놓는 순간
  let pending = null;    // 이번에 나올 번호
  let leverT = -1e9;     // 레버를 당긴 시각
  let winT = -1e9;       // 당첨된 시각
  let bits = [];         // 당첨 때 흩날리는 조각
  const reels = strips.map(s => ({ n: s.length, pos: 0, base: 0, plan: null, stopped: true, speed: 0, lastCell: 0 }));
  function buildTens() {                               // 번호 범위에 나오는 십의 자리 숫자만, 띠가 짧지 않도록 되풀이해서 놓는다
    const lo = Math.floor(LO / 10), hi = Math.floor(HI / 10), ds = [];
    while (ds.length < 8) for (let d = lo; d <= hi; d++) ds.push(d);
    strips[1] = ds.flatMap((d, k) => [{ d }, { s: FRUITS[k % 5] }]);
    reels[1].n = strips[1].length; reels[1].pos = reels[1].base = 0;
  }

  /* ---------- 소리 ---------- */
  let soundOn = true, actx = null;
  try { soundOn = localStorage.getItem('slot-sound') !== 'off'; } catch (e) {}
  function ensureAudio() {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { actx = null; }
  }
  function tone(freq, dur, gain, type, delay, slideTo) {
    if (!soundOn || !actx) return;
    try {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + (delay || 0);
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  const sfx = {
    lever() {
      tone(300, PULL, 0.05, 'triangle', 0, 520);                       // 끼이익 당기고
      const r = PULL + HOLD;
      tone(150, 0.32, 0.3, 'sine', r, 62);                             // 퉁!
      tone(300, 0.12, 0.1, 'triangle', r, 110);
      tone(95, 0.2, 0.12, 'sine', r + 0.16, 70);                       // 여운
    },
    tick: () => tone(1250, 0.03, 0.022, 'sine'),
    stop: i => { tone([196, 220, 262][i], 0.12, 0.14, 'sine', 0, 120); tone([660, 784, 988][i], 0.09, 0.05, 'triangle'); },
    win() {                                                            // 당첨: 팡파르 + 벨이 요란하게
      [523, 659, 784, 1047, 1319, 1568, 2093].forEach((f, i) => tone(f, 0.16, 0.1, 'square', 0.07 * i));
      for (let i = 0; i < 14; i++) tone(i % 2 ? 2093 : 1568, 0.09, 0.07, 'square', 0.55 + i * 0.09);
      for (let i = 0; i < 9; i++) tone(2637, 0.2, 0.06, 'sine', 0.5 + i * 0.16);
      [1047, 1319, 1568, 2093].forEach(f => tone(f, 0.5, 0.07, 'triangle', 1.85));
    }
  };
  function syncSoundBtn() {
    soundBtn.textContent = soundOn ? '소리 켜짐' : '소리 꺼짐';
    soundBtn.setAttribute('aria-pressed', String(soundOn));
  }
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    try { localStorage.setItem('slot-sound', soundOn ? 'on' : 'off'); } catch (e) {}
    syncSoundBtn();
    if (soundOn) { ensureAudio(); tone(988, 0.1, 0.07, 'triangle'); }
  });
  syncSoundBtn();

  /* ---------- 계기판(SETTINGS)과 제외할 번호 ---------- */
  function setPanel(open) {                            // 기계의 SETTINGS 판을 누르면 계기판이 펼쳐진다
    panel.hidden = !open;
    document.body.classList.toggle('open', open);
    drawBg();
  }
  $('closeBtn').addEventListener('click', () => setPanel(false));
  exBtn.addEventListener('click', () => {
    const open = $('exclude').hidden;
    $('exclude').hidden = !open;
    exBtn.setAttribute('aria-pressed', String(open));
  });
  function buildExGrid() {
    exGrid.textContent = '';
    for (let n = LO; n <= HI; n++) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = n; b.dataset.n = n;
      b.classList.toggle('off', userEx.has(n));
      b.setAttribute('aria-pressed', String(userEx.has(n)));
      b.disabled = drawn.includes(n);
      exGrid.appendChild(b);
    }
  }
  exGrid.addEventListener('click', e => {

    const upperPath = () => { ctx.beginPath(); ctx.moveTo(71, 226); ctx.lineTo(469, 226); ctx.lineTo(469, 366); ctx.lineTo(490, 425); ctx.lineTo(60.5, 425); ctx.lineTo(71, 366); ctx.closePath(); };
    upperPath(); ctx.fillStyle = P; ctx.fill(); matte(upperPath);
    ctx.beginPath(); ctx.moveTo(71, 366); ctx.lineTo(469, 366); ctx.lineTo(490, 425); ctx.lineTo(60.5, 425); ctx.closePath(); ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fill();   // 선반 면은 위를 향해 조금 밝다
    upperPath(); seam('rgba(214,100,140,.3)', 1);
    // 둥근 뚜껑(진분홍)
    const lidPath = () => { ctx.beginPath(); ctx.moveTo(71, 226); ctx.ellipse(CX, 226, 199, 164, 0, Math.PI, 0); ctx.closePath(); };
    lidPath(); ctx.fillStyle = LID; ctx.fill(); matte(lidPath, '170,50,95');
    ctx.fillStyle = 'rgba(190,70,110,.2)'; ctx.fillRect(71, 226, 398, 3);                       // 뚜껑과 몸이 만나는 선
    // 방울
    const strobe = winning && Math.floor(winAge / 70) % 2 === 0;
    oval(CX, 62, 13, 13, strobe ? '#ffffff' : gold());
    ctx.fillStyle = '#b9791a'; ctx.fillRect(CX - 7, 63, 14, 2); oval(CX, 68.5, 2, 2, '#b9791a');
    // 이름: 가는 획의 글자에 아주 얇은 두께. 오른쪽에는 30도 기운 작고 뾰족한 하트.
    const nm = nameArt();
    for (const [im, dy] of [[nm.dark, 3], [nm.dark, 1.5], [nm.light, 0]]) ctx.drawImage(im, 0, 0, im.width, im.height, CX - nm.w / 2, 152 - nm.h / 2 + dy, nm.w, nm.h);

    // 릴: 금테 세 칸이 윗몸에 바로 붙어 있다. 칸마다 아주 얇은 두께.
    for (let i = 0; i < 3; i++) {
      const x = reelX(i);
      rr(x - 8, REEL_TOP - 8 + 3, REEL_W + 16, REEL_H + 16, 15); ctx.fillStyle = '#d99a2e'; ctx.fill();          // 아래로 살짝 보이는 두께
      rr(x - 8, REEL_TOP - 8, REEL_W + 16, REEL_H + 16, 15); ctx.fillStyle = gold(); ctx.fill();
      rr(x - 1.5, REEL_TOP - 1.5, REEL_W + 3, REEL_H + 3, 9); ctx.fillStyle = '#d99a2e'; ctx.fill();               // 안쪽 턱
      ctx.save(); rr(x, REEL_TOP, REEL_W, REEL_H, 8); ctx.clip(); drawReel(i); ctx.restore();
    }
    if (suspense()) {                                                                       // 가운데 칸에 시선을 모은다
      for (const i of [0, 2]) { rr(reelX(i), REEL_TOP, REEL_W, REEL_H, 8); ctx.fillStyle = 'rgba(168,67,106,.4)'; ctx.fill(); }
      const pulse = 0.5 + 0.5 * Math.sin(now / 80);
      rr(reelX(1) + 2, REEL_TOP + 2, REEL_W - 4, REEL_H - 4, 7); edge(3 + 3 * pulse, 'rgba(255,111,159,' + (0.55 + 0.45 * pulse) + ')');
    }
    if (winning) { ctx.beginPath(); ctx.moveTo(103, REEL_CY); ctx.lineTo(437, REEL_CY); edge(beat % 2 ? 4 : 2, beat % 2 ? 'rgba(255,255,255,.75)' : 'rgba(255,214,102,.85)'); }
    // 하트 단추 (선반 위)
    for (let i = 0; i < 3; i++) {
      const x = reelX(i) + REEL_W / 2, lit = winning ? (i + beat) % 2 === 0 : spinning && !reels[i].stopped && beat % 2 === 0;
      oval(x, 400, 19, 16, P_D); oval(x, 397, 19, 16, lit ? '#fff1a8' : '#fffaf7');
      heartPath(x, 397, 6); ctx.fillStyle = LID; ctx.fill();
    }
    // SETTINGS 단추: 누르면 계기판이 열린다. 첫 추첨 전에는 눈에 띄게 반짝이고, 추첨이 시작되면 차분한 색으로 돌아간다.
    const fresh = drawn.length === 0 && state === 'idle' && panel.hidden;
    if (fresh) {
      const pu = 0.5 + 0.5 * Math.sin(now / 260);
      soft(CX, 544, 96 + 10 * pu, 40 + 5 * pu, 'rgba(255,241,168,' + (0.55 + 0.35 * pu) + ')');
      rr(204 - 2 * pu, 524 + 3, 132 + 4 * pu, 40 + 2 * pu, 21); ctx.fillStyle = '#f0a43c'; ctx.fill();
      rr(204 - 2 * pu, 524 - 2 * pu, 132 + 4 * pu, 40 + 4 * pu, 21); ctx.fillStyle = Math.floor(now / 320) % 2 ? '#fff6c9' : '#ffffff'; ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = '#ffd166'; ctx.stroke();
      for (const [sx2, sy2, ph, sz] of [[190, 520, 0, 9], [350, 528, 1.6, 7], [338, 572, 3.1, 8], [200, 570, 4.4, 6], [270, 510, 2.3, 6]]) {   // 반짝이는 별
        const tw = Math.max(0, Math.sin(now / 210 + ph)), q = sz * tw;
        ctx.beginPath(); ctx.moveTo(sx2, sy2 - q); ctx.quadraticCurveTo(sx2, sy2, sx2 + q, sy2); ctx.quadraticCurveTo(sx2, sy2, sx2, sy2 + q); ctx.quadraticCurveTo(sx2, sy2, sx2 - q, sy2); ctx.quadraticCurveTo(sx2, sy2, sx2, sy2 - q); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = '#ffd166'; ctx.stroke();
      }
    } else {
      rr(204, 524 + 3, 132, 40, 20); ctx.fillStyle = P_D; ctx.fill();
      rr(204, 524, 132, 40, 20); ctx.fillStyle = '#fffaf5'; ctx.fill();
    }
    const blinkS = panel.hidden && Math.floor(now / 600) % 2 === 0;                            // 닫혀 있을 때는 깜빡여서 누를 곳을 알린다
    ctx.save(); ctx.translate(CX + 0.7, 545); ctx.scale(0.95, 1);                               // 글자 간격은 좁게, 장평 95%
    ctx.font = '20px ' + NUMFONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.letterSpacing = '1.5px'; ctx.fillStyle = fresh ? '#ff4d8a' : blinkS ? '#f06a98' : LID; ctx.fillText('SETTINGS', 0, 0); ctx.letterSpacing = '0px'; ctx.restore();
    // 간식 나오는 구멍 (당첨되면 물고기 간식이 톡)
    rr(226, 592 + 3, 88, 70, 17); ctx.fillStyle = '#d99a2e'; ctx.fill();
    rr(226, 592, 88, 70, 17); ctx.fillStyle = gold(); ctx.fill();
    rr(239, 604, 62, 46, 10); ctx.fillStyle = '#7d2f52'; ctx.fill();
    if (prize) { const u = Math.min(1, winAge / 400), hop = Math.sin(Math.min(1, winAge / 700) * Math.PI) * 12; ctx.save(); ctx.translate(CX, 642 - 15 * u - hop); ctx.scale(0.78, 0.78); art[prize](); ctx.restore(); }   // 보상은 다음 추첨 전까지 남는다
    ctx.restore();

    // 당첨 조각
    bits = bits.filter(b => b.life > 0 && b.y < H + 20);
    for (const b of bits) {
      b.x += b.vx; b.y += b.vy; b.vy += 0.3; b.vx *= 0.99; b.life -= 0.012; b.rot += b.vr;
      ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, b.life * 2)); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.fillStyle = b.c; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.rot * 2)) + 1);
      ctx.restore();
    }
    if (winning && winAge < 140) { ctx.fillStyle = 'rgba(255,255,255,' + 0.5 * (1 - winAge / 140) + ')'; ctx.fillRect(0, 0, W, H); }   // 번쩍
  }

  /* ---------- 반복 ---------- */
  function frame(now) {
    advance(now);
    render(now);
    requestAnimationFrame(frame);
  }

  /* ---------- 버튼 ---------- */
  drawBtn.addEventListener('click', startDraw);
  canvas.addEventListener('click', e => {
    const r = canvas.getBoundingClientRect();
    const mx = (e.clientX - r.left) / r.width * W - OX, my = (e.clientY - r.top) / r.height * H - OY;
    if (mx > 204 && mx < 336 && my > 520 && my < 570) { setPanel(panel.hidden); return; }   // 아래쪽 SETTINGS 판
    if (state === 'idle' && pool().length === 0) { setPanel(true); return; }
    startDraw();
  });
  document.addEventListener('keydown', e => {
    if (e.repeat || e.target instanceof HTMLInputElement) return;
    if (e.code === 'KeyS') { setPanel(panel.hidden); return; }
    if (e.code === 'Escape') { setPanel(false); return; }
    if (e.code !== 'Space' || e.target instanceof HTMLButtonElement) return;   // 버튼 위에서는 버튼이 직접 처리
    e.preventDefault();
    startDraw();
  });

  let armTimer = null;
  function disarm() {
    clearTimeout(armTimer); armTimer = null;
    resetBtn.classList.remove('armed');
    resetBtn.textContent = '처음부터 다시';
  }
  resetBtn.addEventListener('click', () => {
    if (state !== 'idle') return;
    if (!armTimer) {                                      // 실수로 지우지 않도록 두 번 눌러야 한다
      resetBtn.classList.add('armed');
      resetBtn.textContent = '한 번 더 누르기';
      armTimer = setTimeout(disarm, 3000);
      return;
    }
    disarm();
    nowBox.classList.remove('win');
    resetAll();
  });

  /* ---------- 번호 범위 ---------- */
  // "1-31"처럼 적는다. "31"만 적으면 1-31로 본다. 바꾸면 처음부터 다시 시작한다.
  const rangeInput = $('rangeInput');
  const rangeBox = rangeInput.parentElement;
  function parseRange(text) {
    const m = /^\s*(\d{1,2})\s*(?:[-~]\s*(\d{1,2}))?\s*$/.exec(text);
    if (!m) return null;
    const lo = m[2] ? Number(m[1]) : 1, hi = Number(m[2] || m[1]);
    if (lo < 1 || hi < lo || hi - lo + 1 > MAX_COUNT) return null;
    return [lo, hi];
  }
  function setRange(lo, hi) { LO = lo; HI = hi; TOTAL = hi - lo + 1; rangeInput.value = lo + '-' + hi; }
  rangeInput.addEventListener('keydown', e => { if (e.key === 'Enter') rangeInput.blur(); });
  rangeInput.addEventListener('change', () => {
    const r = parseRange(rangeInput.value);
    if (!r || state !== 'idle') {                         // 잘못 적었거나 도는 중이면 되돌린다
      rangeInput.value = LO + '-' + HI;
      rangeBox.classList.remove('bad'); void rangeBox.offsetWidth; rangeBox.classList.add('bad');
      return;
    }
    if (r[0] === LO && r[1] === HI) { rangeInput.value = LO + '-' + HI; return; }
    setRange(r[0], r[1]);
    userEx = new Set();                                   // 범위가 바뀌면 화면에서 고른 제외 번호는 비운다
    try { localStorage.setItem('slot-range', LO + '-' + HI); } catch (e) {}
    resetAll();
  });
  try {
    const saved = parseRange(localStorage.getItem('slot-range') || '');
    if (saved) setRange(saved[0], saved[1]);
  } catch (e) {}

  /* ---------- 전체 화면 ---------- */
  const fullBtn = $('fullBtn');
  const root = document.documentElement;
  const fsNow = () => document.fullscreenElement || document.webkitFullscreenElement;
  const fsEnter = root.requestFullscreen || root.webkitRequestFullscreen;
  const fsExit = document.exitFullscreen || document.webkitExitFullscreen;
  if (!fsEnter || !fsExit) {
    fullBtn.hidden = true;                                // 아이폰 사파리처럼 지원하지 않는 곳에서는 버튼을 감춘다
  } else {
    fullBtn.addEventListener('click', () => {
      try {
        const r = fsNow() ? fsExit.call(document) : fsEnter.call(root);
        if (r && r.catch) r.catch(() => {});
      } catch (e) {}
    });
    const sync = () => { fullBtn.textContent = fsNow() ? '전체 화면 끝내기' : '전체 화면'; setTimeout(fitCanvas, 60); };
    document.addEventListener('fullscreenchange', sync);
    document.addEventListener('webkitfullscreenchange', sync);
  }

  drawBg();
  resetAll();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
